name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

env:
    P_VER: "3.12"

jobs:

    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Copy code
              uses: actions/checkout@v7
            - name: Setup python
              uses: actions/setup-python@v5
              with:
                python-version: ${{ env.P_VER }}
            - name: Cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
            - name: Install dependencies
              run: pip install -r requirements.txt
            - name: Run mypy
              run: mypy .

    test:
        runs-on: ubuntu-latest
        needs: lint
        services:
            postgres:
                image: postgres:17
                ports:
                    - 5432:5432
                env:
                    POSTGRES_USER: testuser
                    POSTGRES_PASSWORD: testpass
                    POSTGRES_DB: fakturo_test
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 3

            redis:
                image: redis:7
                ports:
                - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 3

        steps:
            - name: Copy code
              uses: actions/checkout@v7
            - name: Setup python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.P_VER }}
            - name: Cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
            - name: Install dependencies
              run: pip install -r requirements.txt
            - name: Run test
              env:
                  test_db_url: postgresql+asyncpg://testuser:testpass@localhost:5432/fakturo_test
                  DB_URL: ${{ secrets.DB_URL }}
                  SECRET_KEY: ${{ secrets.SECRET_KEY }}
                  redis_host: localhost
              run: pytest
