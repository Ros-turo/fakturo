<!DOCTYPE html>
<html lang="cs">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Fakturo</title>
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    </head>
    <body>
        <header>
            <img id="Fakturo_logo" src="images/favicon-512x512.png" alt="Fakturo">
            <nav>
                <a href="#">Faktury</a>
                <a href="#">Nová faktura</a>
            </nav>
        </header>
        <main>
            <section>
                <h2>Nová faktura</h2>
                <form>

                    <div class="invoice_create">
                        <label for="client_id">Odběratel</label>
                        <input type="number" id="client_id" name="client_id" required min="1"> <!-- placeholder for clients api-->
                    </div>
                    <div class="invoice_create">
                        <label for="issue_date">Datum vystavení</label>
                        <input type="date" id="issue_date" name="issue_date" required>
                    </div>
                    <div class="invoice_create">
                        <label for="overdue_date">Datum splatnosti</label>
                        <input type="date" id="overdue_date" name="overdue_date" required>
                    </div>
                    <fieldset id="invoice_item">
                        <legend>Položka faktury</legend>
                        <div class="invoice_create">
                            <label for="description">Název položky</label>
                            <input type="text" name="description" id="description" required>
                        </div>
                        <div class="invoice_create">
                            <label for="unit_price">Cena jednoho kusu</label>
                            <input type="number" name="unit_price" id="unit_price" required min="1" step="0.01">
                        </div>
                        <div class="invoice_create">
                            <label for="quantity">Počet kusů</label>
                            <input type="number" name="quantity" id="quantity" required min="1">
                        </div>
                        <div class="invoice_create">
                            <label for="vat_rate">Procento DPH</label>
                            <select name="vat_rate" id="vat_rate">
                                <option value="21">21%</option>
                                <option value="12">12%</option>
                                <option value="0">0%</option>
                            </select>
                        </div>
                    </fieldset>
                    <div class="invoice_create" id="send_client_email_div">
                        <label for="send_client_email">Odeslat e-mailem odběrateli</label>
                        <input type="checkbox" id="send_client_email" name="send_client_email">
                    </div>
                    <div>
                        <button type="submit">Odeslat fakturu</button>
                    </div>

                </form>
            </section>
        </main>
        <footer>
            <p>Copyright</p>
        </footer>
    </body>
</html>
