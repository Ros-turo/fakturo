services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  db:
    image: postgres:16
    ports:
      - "5433:5432"
    env_file:
      - .env.db
    volumes:
      - postgres_store:/var/lib/postgresql/data
      - ./init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      retries: 3
      timeout: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
      timeout: 10s

  worker:
    build: .
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=debug"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_store: